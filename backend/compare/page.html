<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GlucoPilot · Compare</title>
<style>
:root { --bg:#f7f7f4; --panel:#ffffff; --panel-2:#f1f2ef; --border:#e3e5df; --border-strong:#cfd3cb; --text:#24282b; --muted:#5f6a70; --faint:#9aa3a8;
  --accent:#2f8f83; --accent-soft:#e2f1ee; --good:#2f9e5f; --warn:#d68b1c; --bad:#d1443f; --good-soft:#e4f4ea; --warn-soft:#fcefd9; --bad-soft:#fbe3e2;
  --font:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --fs-xs:12px; --fs-sm:13px; --fs-md:15px; --fs-lg:18px; --fs-xl:24px; --fs-xxl:34px; --fs-hero:56px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:40px; --radius:14px; --radius-sm:8px; --shadow:0 1px 2px rgba(20,30,30,.05); color-scheme: light;
  --footer-h: 150px; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: var(--fs-md); line-height: 1.4; }
body { min-height: 100vh; }
.top { display: flex; align-items: baseline; gap: var(--s5); padding: var(--s3) var(--s6) 0; }
.brand { font-size: var(--fs-xxl); font-weight: 700; letter-spacing: -.5px; }
.brand span { color: var(--accent); }
.tag { font-size: var(--fs-xl); color: var(--muted); font-weight: 500; flex: 1; }
.clock { font-size: var(--fs-lg); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.clock b { color: var(--text); font-weight: 600; }
main { padding: var(--s3) var(--s6) 0; max-width: 1800px; margin: 0 auto; }
.state-initial main { padding-bottom: calc(var(--footer-h) + 24px); }
.state-answer main { padding-bottom: var(--s6); }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--accent-soft); display: inline-flex; align-items: center; justify-content: center; font-size: 26px; flex: none; }
.avatar.sm { width: 34px; height: 34px; font-size: 18px; }
.tone-good { color: var(--good); } .tone-warn { color: var(--warn); } .tone-bad { color: var(--bad); } .tone-off { color: var(--muted); }

/* ---- initial: three mini dashboards */
.cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s5); transition: opacity .3s ease, transform .3s ease, max-height .3s ease; max-height: 1400px; overflow: hidden; }
.col { padding: var(--s3) var(--s4); display: grid; gap: var(--s2); align-content: start; min-width: 0; }
.col .who { display: flex; align-items: center; gap: var(--s3); }
.col .who b { font-size: var(--fs-lg); }
.col .who small { display: block; color: var(--muted); font-size: var(--fs-sm); }
.hero { display: grid; grid-template-columns: 118px 1fr; gap: var(--s3); align-items: center; }
.hero .num { font-size: 48px; font-weight: 700; line-height: 1; letter-spacing: -2px; font-variant-numeric: tabular-nums; }
.hero .num .unit { display: block; font-size: var(--fs-xs); color: var(--muted); font-weight: 400; letter-spacing: 0; margin-top: 4px; }
.hero .trend { display: flex; align-items: baseline; gap: 6px; font-size: var(--fs-md); font-weight: 600; margin-top: 6px; }
.hero .trend .arrow { font-size: var(--fs-xl); }
.hero svg.mini { display: block; width: 100%; height: 112px; }
.h4 { font-size: var(--fs-xs); font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 2px 0 0; }
.coming { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); }
.coming .cu { padding: 6px var(--s3); display: grid; gap: 1px; min-width: 0; }
.coming .title { display: flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--muted); font-weight: 500; }
.coming .when { font-size: var(--fs-md); font-weight: 600; font-variant-numeric: tabular-nums; }
.coming .when small { font-size: var(--fs-xs); color: var(--faint); font-weight: 400; margin-left: 4px; }
.coming .text { font-size: var(--fs-xs); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s2); }
.tile { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px var(--s3); display: grid; grid-template-rows: 16px 22px 5px 16px; row-gap: 3px; min-width: 0; text-align: left; }
.tile .t-head { display: flex; align-items: center; gap: 5px; white-space: nowrap; overflow: hidden; }
.tile .t-head .icon { font-size: 14px; line-height: 1; flex: none; }
.tile .t-head .label { font-size: var(--fs-xs); color: var(--muted); font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.tile .t-val { font-size: var(--fs-md); font-weight: 600; line-height: 22px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
.tile .t-val .unit { font-size: var(--fs-xs); color: var(--muted); font-weight: 400; margin-left: 4px; }
.tile .t-bar { height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
.tile .t-bar i { display: block; height: 100%; border-radius: 3px; }
.tile .fill-good { background: var(--good); } .tile .fill-warn { background: var(--warn); } .tile .fill-bad { background: var(--bad); }
.tile .t-word { font-size: var(--fs-xs); font-weight: 600; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.learned { border-top: 1px solid var(--border); padding-top: var(--s2); display: grid; gap: 6px; }
.chips-l { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-l { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--border-strong); border-radius: 999px; padding: 3px 10px 3px 8px; font-size: var(--fs-sm); background: var(--panel-2); white-space: nowrap; }

/* ---- answer state: compact strip, question, panels, summary */
.state-answer .cols { max-height: 0; opacity: 0; transform: translateY(-16px); margin-bottom: 0; pointer-events: none; }
.strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s4); opacity: 0; max-height: 0; overflow: hidden; transform: translateY(-8px); transition: opacity .3s ease .15s, transform .3s ease .15s, max-height .3s ease; }
.state-answer .strip { opacity: 1; max-height: 120px; transform: none; }
.strip .mini { display: flex; align-items: center; gap: var(--s3); padding: var(--s2) var(--s4); }
.strip .mini b { font-size: var(--fs-md); }
.strip .mini small { display: block; color: var(--muted); font-size: var(--fs-sm); }
.qbar { display: flex; align-items: center; gap: var(--s4); margin-top: var(--s4); opacity: 0; max-height: 0; overflow: hidden; transform: translateY(40px); transition: opacity .3s ease .2s, transform .35s ease .2s, max-height .3s ease .2s; }
.state-answer .qbar { opacity: 1; max-height: 90px; transform: none; }
.qbar .q { font-size: var(--fs-xxl); font-weight: 700; letter-spacing: -.3px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qbar .tagc { font-size: var(--fs-xs); color: var(--muted); border: 1px solid var(--border-strong); border-radius: 999px; padding: 2px 8px; }
.switch { display: inline-flex; align-items: center; gap: var(--s2); font-size: var(--fs-sm); color: var(--muted); cursor: pointer; user-select: none; white-space: nowrap; }
.switch .track { width: 46px; height: 26px; border-radius: 13px; background: var(--border-strong); position: relative; transition: background .2s; }
.switch .track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch.on .track { background: var(--accent); }
.switch.on .track::after { transform: translateX(20px); }
.switch b { color: var(--text); }
button { font: inherit; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--panel); color: var(--text); padding: 10px 18px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.panels { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s5); margin-top: var(--s5); }
.panel { padding: var(--s4) var(--s5) var(--s5); opacity: 0; transform: translateY(24px); transition: opacity .4s ease, transform .4s ease; display: grid; gap: var(--s3); }
.panel.in { opacity: 1; transform: none; }
.panel .chart { width: 100%; height: 220px; display: block; }
.panel .verdict { font-size: var(--fs-xxl); font-weight: 700; letter-spacing: -.4px; line-height: 1.1; transition: opacity .15s; }
.panel .cond { font-size: var(--fs-md); min-height: 1.4em; color: var(--muted); }
.panel .stat3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--s3); font-size: var(--fs-sm); }
.panel .stat3 .k { color: var(--muted); display: block; }
.panel .stat3 b { font-size: var(--fs-lg); font-variant-numeric: tabular-nums; }
.panel .reason { font-size: var(--fs-md); border-top: 1px solid var(--border); padding-top: var(--s3); }
.panel .cause { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-sm); color: var(--muted); }
.summary { margin-top: var(--s5); padding: var(--s5); opacity: 0; transform: translateY(16px); transition: opacity .35s ease, transform .35s ease; display: grid; gap: var(--s3); }
.summary.in { opacity: 1; transform: none; }
.summary .head { font-size: var(--fs-xxl); font-weight: 700; letter-spacing: -.4px; line-height: 1.15; }
.summary .head small { display: block; font-size: var(--fs-xl); font-weight: 600; color: var(--muted); margin-top: 4px; }
.summary ul { margin: 0; padding-left: 20px; font-size: var(--fs-lg); display: grid; gap: 6px; }
.summary .same { font-size: var(--fs-xl); color: var(--muted); }
.hidden { display: none !important; }
.skel { padding: var(--s4) var(--s5) var(--s5); display: grid; gap: var(--s3); min-height: 420px; }
.skel .bar { height: 3px; background: var(--panel-2); border-radius: 2px; overflow: hidden; }
.skel .bar i { display: block; height: 100%; width: 30%; background: var(--accent); border-radius: 2px; animation: prog 1.1s ease-in-out infinite; }
@keyframes prog { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
.skel .blk { background: var(--panel-2); border-radius: var(--radius-sm); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
.skel .sim { font-size: var(--fs-md); font-weight: 600; color: var(--muted); }
.skel .st { font-size: var(--fs-sm); color: var(--faint); min-height: 1.3em; transition: opacity .15s; }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border-strong); border-radius: 999px; padding: 6px 12px; font-size: var(--fs-sm); color: var(--muted); background: var(--panel); white-space: nowrap; }
.pill .spk { width: 14px; height: 14px; }

/* ---- the ask bar: a fixed footer with a solid background (the columns end 24 px above it) */
.ask { position: fixed; left: 0; right: 0; bottom: 0; padding: var(--s2) var(--s6) var(--s3); background: var(--bg); border-top: 1px solid var(--border); transition: opacity .25s ease, transform .3s ease; z-index: 5; }
.state-answer .ask { opacity: 0; transform: translateY(30px); pointer-events: none; }
.ask .inner { max-width: 1800px; margin: 0 auto; display: grid; gap: var(--s2); }
.chips { display: flex; flex-wrap: wrap; gap: var(--s2); }
.chip { border-radius: 999px; border: 1px solid var(--border-strong); background: var(--panel); padding: 6px 12px; font-size: var(--fs-sm); cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.chip:hover { border-color: var(--accent); }
.chip i { font-style: normal; background: var(--panel-2); border-radius: 6px; padding: 0 6px; color: var(--muted); font-size: var(--fs-xs); }
.askrow { display: flex; gap: var(--s3); align-items: center; }
.askrow input { flex: 1; font: inherit; font-size: var(--fs-lg); padding: 10px 18px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--panel); color: var(--text); }
.askrow input:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
.askrow button { font-size: var(--fs-md); padding: 10px 24px; }
.status { font-size: var(--fs-sm); color: var(--muted); }
.status:empty { display: none; }
</style>
</head>
<body class="state-initial">
<header class="top"><div class="brand">Gluco<span>Pilot</span></div><div class="tag">Same question. Three bodies. Three answers.</div><div class="clock" id="clock" data-testid="clock"></div></header>
<main id="main">
  <section id="cols" class="cols" data-testid="columns"></section>
  <section id="strip" class="strip" data-testid="strip"></section>
  <section id="qbar" class="qbar" data-testid="qbar">
    <div class="q" id="qtext"></div>
    <span class="tagc hidden" id="qtag">cached</span>
    <span class="pill" id="pill-q" data-testid="pill-q"></span>
    <label class="switch on" id="toggle" data-testid="toggle" title="Off: the population model, the same for everyone. On: each person's own twin.">
      <span>Average</span><span class="track"></span><b>Personalized</b>
    </label>
    <button type="button" id="again" data-testid="again">Ask another</button>
  </section>
  <section id="panels" class="panels hidden" data-testid="panels"></section>
  <section id="summary" class="summary card hidden" data-testid="summary"></section>
</main>
<footer class="ask" id="ask" data-testid="ask">
  <div class="inner">
    <div class="chips" id="chips"></div>
    <form class="askrow" id="form"><input id="input" type="text" placeholder="Ask all three the same question…" aria-label="question" autocomplete="off" /><span class="pill" id="pill-a" data-testid="pill-a"></span><button type="submit" class="primary">Ask</button></form>
    <div class="status" id="status"></div>
  </div>
</footer>
<script id="bundle" type="application/json">__BUNDLE__</script>
<script>
(function () {
  'use strict'
  const $ = (s, el) => (el || document).querySelector(s)
  const bundle = JSON.parse($('#bundle').textContent)
  let data = bundle                       // { personas, results: {slug: res}, bank: [{slug, text}], now, wall_now, live, parser }
  let personalized = true
  let current = null                      // the result currently shown
  let drawn = {}                          // per-person current curve values (for tweening)
  const ORDER = ['alex', 'priya', 'marcus']
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'], WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']
  const fmt12 = (iso) => { const h = +iso.slice(11, 13), m = iso.slice(14, 16); return `${h % 12 || 12}:${m} ${h < 12 ? 'am' : 'pm'}` }
  const fmtDate = (d) => `${WD[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}`
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
  const minutes = (a, b) => (new Date(b) - new Date(a)) / 60000
  const timing = { start: 0, summary: 0 }
  window.__compare = { timing, get data() { return data }, get current() { return current }, get personalized() { return personalized } }

  // ------------------------------------------------------------ the header clock (real time, ticking every minute)
  function renderClock() {
    const d = new Date()
    const h = d.getHours(), m = String(d.getMinutes()).padStart(2, '0')
    $('#clock').innerHTML = `${esc(fmtDate(d))} · <b>${h % 12 || 12}:${m} ${h < 12 ? 'am' : 'pm'}</b>`
    $('#clock').dataset.iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}T${String(h).padStart(2, '0')}:${m}`
  }
  renderClock()
  setTimeout(() => { renderClock(); setInterval(renderClock, 60000) }, (60 - new Date().getSeconds()) * 1000 + 50)

  // ------------------------------------------------------------ the reader pill
  const SPARK = '<svg class="spk" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c.6 5.4 4.6 9.4 10 10-5.4.6-9.4 4.6-10 10-.6-5.4-4.6-9.4-10-10 5.4-.6 9.4-4.6 10-10z" fill="#5f6a70"/></svg>'
  function renderPill() {
    const on = !!(data.parser && data.parser.gemini)
    for (const id of ['#pill-q', '#pill-a']) { const el = $(id); if (el) el.innerHTML = on ? `${SPARK}Powered by Gemini` : `${SPARK}Local parser` }
  }

  // ------------------------------------------------------------ the mini Home chart: 3 h back (sensor) and 3 h ahead (forecast), now marker
  const MC = { w: 300, h: 132, pl: 26, pr: 6, pt: 14, pb: 16 }
  function miniChart(p) {
    const W = MC.w, H = MC.h
    const hist = p.history || { times: [], display: [] }, fc = p.forecast || { times: [], median: [], p10: [], p90: [] }
    const t0 = hist.times[0] || fc.times[0], tEnd = fc.times[fc.times.length - 1] || hist.times[hist.times.length - 1]
    const span = Math.max(minutes(t0, tEnd), 1)
    const x = (iso) => MC.pl + (minutes(t0, iso) / span) * (W - MC.pl - MC.pr)
    const y = (v) => MC.pt + (1 - (Math.min(Math.max(v, 40), 300) - 40) / 260) * (H - MC.pt - MC.pb)
    let d = '', pen = false
    hist.times.forEach((t, i) => { const v = hist.display[i]; if (v == null) { pen = false; return } d += `${pen ? 'L' : 'M'}${x(t).toFixed(1)},${y(v).toFixed(1)} `; pen = true })
    const last = hist.display.length ? hist.display[hist.display.length - 1] : null
    const off = last != null && fc.median.length ? last - fc.median[0] : 0
    const med = fc.median.map((v, i) => v + off * Math.max(0, 1 - i / 12))
    const p10 = fc.p10.map((v, i) => v + off * Math.max(0, 1 - i / 12)), p90 = fc.p90.map((v, i) => v + off * Math.max(0, 1 - i / 12))
    const fpath = med.map((v, i) => `${i ? 'L' : 'M'}${x(fc.times[i]).toFixed(1)},${y(v).toFixed(1)}`).join(' ')
    const band = p10.length ? p90.map((v, i) => `${i ? 'L' : 'M'}${x(fc.times[i]).toFixed(1)},${y(v).toFixed(1)}`).join(' ') + ' ' + p10.map((v, i) => { const j = p10.length - 1 - i; return `L${x(fc.times[j]).toFixed(1)},${y(p10[j]).toFixed(1)}` }).join(' ') + ' Z' : ''
    const nowIso = p.wall_now || p.as_of
    const nx = Math.min(Math.max(x(nowIso), MC.pl), W - MC.pr)
    const ticks = hist.times.concat(fc.times.slice(1)).filter((t) => t.slice(14, 16) === '00')
    return `<svg class="mini" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" data-testid="mini-chart" aria-label="last 3 hours and next 3 hours">
      <rect x="${MC.pl}" y="${y(p.target_high || 180).toFixed(1)}" width="${W - MC.pl - MC.pr}" height="${(y(p.target_low || 70) - y(p.target_high || 180)).toFixed(1)}" fill="#2f9e5f" opacity=".09"/>
      ${[70, 180].map((v) => `<text x="${MC.pl - 4}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end" font-size="9" fill="#9aa3a8">${v}</text>`).join('')}
      ${ticks.map((t) => `<text x="${x(t).toFixed(1)}" y="${H - 4}" text-anchor="middle" font-size="9" fill="#9aa3a8">${fmt12(t).replace(':00', '')}</text>`).join('')}
      ${band ? `<path class="band" d="${band}" fill="#2f8f83" opacity=".13"/>` : ''}
      <line x1="${nx.toFixed(1)}" x2="${nx.toFixed(1)}" y1="${MC.pt - 2}" y2="${H - MC.pb}" stroke="#5f6a70" stroke-dasharray="3 3"/>
      <text x="${nx.toFixed(1)}" y="${MC.pt - 4}" text-anchor="middle" font-size="9" fill="#5f6a70" data-testid="now-label">now</text>
      <path class="sensor" d="${d.trim()}" fill="none" stroke="#24282b" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
      <path class="fc" d="${fpath}" fill="none" stroke="#2f8f83" stroke-width="1.5" stroke-dasharray="4 3" vector-effect="non-scaling-stroke"/>
    </svg>`
  }
  function relDay(iso, nowIso) {
    const d = new Date(iso), n = new Date(nowIso)
    const days = Math.round((new Date(d.toDateString()) - new Date(n.toDateString())) / 86400000)
    return days === 0 ? 'today' : days === 1 ? 'tomorrow' : WD[d.getDay()]
  }
  function tileHtml(t) {
    return `<div class="tile" data-testid="tile-${t.key}" data-tone="${t.tone}"><div class="t-head"><span class="icon">${t.icon}</span><span class="label">${esc(t.label)}</span></div>
      <div class="t-val">${t.value}<span class="unit">${esc(t.unit)}</span></div>
      <div class="t-bar"><i class="fill-${t.tone}" style="width:${Math.round(100 * t.level)}%"></i></div>
      <div class="t-word tone-${t.tone}">${esc(t.status)}</div></div>`
  }
  function renderColumns() {
    const cols = $('#cols'), strip = $('#strip')
    cols.innerHTML = ''; strip.innerHTML = ''
    for (const p of data.personas) {
      const col = document.createElement('div'); col.className = 'card col'; col.dataset.person = p.id; col.dataset.testid = `col-${p.id}`
      const coming = (p.coming_up || []).map((c) => `<div class="card cu" data-testid="cu-${c.key}"><div class="title"><span>${c.icon}</span>${esc(c.title)}</div>
          <div class="when">${c.time ? `${fmt12(c.time)}<small>${relDay(c.time, p.wall_now || p.as_of)}</small>` : '—'}</div><div class="text" title="${esc(c.text)}">${esc(c.text)}</div></div>`).join('')
      const chips = (p.chips || []).map((c) => `<span class="chip-l"><span>${c.icon}</span>${esc(c.label)}</span>`).join('')
      col.innerHTML = `
        <div class="who"><span class="avatar">${p.avatar}</span><span><b>${esc(p.name)}</b><small>${esc(p.lifestyle)}</small></span></div>
        <div class="hero">
          <div><div class="num tone-${p.tone}" data-testid="glucose">${p.glucose}<span class="unit">mg/dL</span></div><div class="trend tone-${p.tone}"><span class="arrow">${p.trend_arrow}</span>${esc(p.trend)}</div></div>
          ${miniChart(p)}
        </div>
        <div class="h4">Coming up</div>
        <div class="coming">${coming}</div>
        <div class="h4">Right now</div>
        <div class="tiles" data-testid="tiles-${p.id}">${(p.tiles || []).map(tileHtml).join('')}</div>
        <div class="learned" data-testid="learned-${p.id}"><div class="h4">What the twin learned</div><div class="chips-l">${chips}</div></div>`
      cols.appendChild(col)
      const mini = document.createElement('div'); mini.className = 'card mini'
      mini.innerHTML = `<span class="avatar sm">${p.avatar}</span><span><b>${esc(p.name)}</b><small>${esc(p.lifestyle)}</small></span>`
      strip.appendChild(mini)
    }
  }
  function fitFooter() { const h = $('#ask').getBoundingClientRect().height; document.documentElement.style.setProperty('--footer-h', `${Math.ceil(h)}px`) }
  function renderChips() {
    const c = $('#chips'); c.innerHTML = ''
    data.bank.forEach((b, i) => {
      const el = document.createElement('button'); el.type = 'button'; el.className = 'chip'; el.dataset.slug = b.slug; el.dataset.testid = `chip-${i + 1}`
      el.innerHTML = `<i>${i + 1}</i>${esc(b.text)}`
      el.addEventListener('click', () => ask(b.text))
      c.appendChild(el)
    })
    // the columns must end above the footer: measure it and pad the main area accordingly
    requestAnimationFrame(fitFooter)
  }

  // ------------------------------------------------------------ the answer chart (six hours around the proposal, now marked)
  const CH = { w: 0, h: 220, pl: 34, pr: 10, pt: 14, pb: 22 }
  const yOf = (v) => CH.pt + (1 - (Math.min(Math.max(v, 40), 300) - 40) / 260) * (CH.h - CH.pt - CH.pb)
  function xOf(i, n) { return CH.pl + (i / Math.max(n - 1, 1)) * (CH.w - CH.pl - CH.pr) }
  function pathOf(vals) { return vals.map((v, i) => `${i ? 'L' : 'M'}${xOf(i, vals.length).toFixed(1)},${yOf(v).toFixed(1)}`).join(' ') }
  function areaOf(lo, hi) {
    const n = lo.length
    const up = hi.map((v, i) => `${i ? 'L' : 'M'}${xOf(i, n).toFixed(1)},${yOf(v).toFixed(1)}`).join(' ')
    const down = lo.map((v, i) => `L${xOf(n - 1 - i, n).toFixed(1)},${yOf(lo[n - 1 - i]).toFixed(1)}`).join(' ')
    return up + ' ' + down + ' Z'
  }
  function window6(curve, marker) {
    // six hours that contain the proposal: from now when it is within the window, else starting an hour before it
    let a = 0
    if (marker) { const mi = curve.times.findIndex((t) => t >= marker.slice(0, 16)); if (mi > 60) a = Math.max(0, mi - 12) }
    const n = Math.min(curve.times.length - a, 73)
    return { times: curve.times.slice(a, a + n), median: curve.median.slice(a, a + n), p10: (curve.p10 || []).slice(a, a + n), p90: (curve.p90 || []).slice(a, a + n) }
  }
  function chartSvg(res, avg, width) {
    CH.w = width
    const c = window6(res.curve, res.marker), a = avg && avg.curve ? window6(avg.curve, avg.marker) : null
    const n = c.times.length
    const ticks = c.times.map((t, i) => ({ t, i })).filter((x) => x.t.slice(14, 16) === '00')
    const mi = res.marker ? c.times.findIndex((t) => t >= res.marker.slice(0, 16)) : -1
    const band = c.p10.length ? `<path class="band" d="${areaOf(c.p10, c.p90)}" fill="#2f8f83" opacity="0.14"/>` : ''
    const nowIso = data.wall_now || res.now || c.times[0]
    const ni = c.times.findIndex((t) => t >= nowIso.slice(0, 16))
    const nowMark = ni >= 0 ? `<line x1="${xOf(ni, n).toFixed(1)}" x2="${xOf(ni, n).toFixed(1)}" y1="${CH.pt}" y2="${CH.h - CH.pb}" stroke="#5f6a70" stroke-dasharray="3 3"/><text x="${xOf(ni, n).toFixed(1)}" y="${CH.pt - 3}" text-anchor="middle" font-size="11" fill="#5f6a70" data-testid="now-label">now</text>` : ''
    return `<svg class="chart" width="${width}" height="${CH.h}" data-testid="chart">
      <rect x="${CH.pl}" y="${yOf(180).toFixed(1)}" width="${(width - CH.pl - CH.pr).toFixed(1)}" height="${(yOf(70) - yOf(180)).toFixed(1)}" fill="#2f9e5f" opacity="0.09"/>
      ${[70, 180, 250].map((v) => `<line x1="${CH.pl}" x2="${width - CH.pr}" y1="${yOf(v).toFixed(1)}" y2="${yOf(v).toFixed(1)}" stroke="#e3e5df" stroke-dasharray="3 3"/><text x="${CH.pl - 6}" y="${(yOf(v) + 4).toFixed(1)}" text-anchor="end" font-size="12" fill="#5f6a70">${v}</text>`).join('')}
      ${ticks.map((x) => `<text x="${xOf(x.i, n).toFixed(1)}" y="${CH.h - 6}" text-anchor="middle" font-size="12" fill="#5f6a70">${fmt12(x.t)}</text>`).join('')}
      ${a ? `<path class="avg" d="${pathOf(a.median)}" fill="none" stroke="#9aa3a8" stroke-width="1.5" opacity="0.6"/>` : ''}
      ${band}
      ${nowMark}
      ${mi >= 0 ? `<line x1="${xOf(mi, n).toFixed(1)}" x2="${xOf(mi, n).toFixed(1)}" y1="${CH.pt}" y2="${CH.h - CH.pb}" stroke="#2f8f83" stroke-width="2"/><text x="${(xOf(mi, n) + 5).toFixed(1)}" y="${CH.pt + 10}" font-size="12" fill="#2f8f83">${esc(res.marker_label || 'proposed')}</text>` : ''}
      <path class="line" d="${pathOf(c.median)}" fill="none" stroke="#2f8f83" stroke-width="2.4" stroke-dasharray="6 4"/>
    </svg>`
  }
  function animateDraw(svg) {
    const line = svg.querySelector('path.line')
    if (!line) return
    const len = line.getTotalLength()
    line.style.strokeDasharray = `${len}`
    line.style.strokeDashoffset = `${len}`
    line.style.transition = 'none'
    requestAnimationFrame(() => requestAnimationFrame(() => {
      line.style.transition = 'stroke-dashoffset .6s ease-out'
      line.style.strokeDashoffset = '0'
      setTimeout(() => { line.style.strokeDasharray = '6 4'; line.style.strokeDashoffset = '0'; line.style.transition = 'none' }, 650)
    }))
  }

  // ------------------------------------------------------------ panels
  function shown(res, who) { return personalized ? res.personal[who] : res.population }
  function panelHtml(p, res, who, width) {
    const r = shown(res, who)
    const cause = r.cause && r.cause.key !== 'average' ? `<div class="cause" data-testid="cause"><span>${r.cause.icon || ''}</span>${esc(r.cause.text)}</div>` : ''
    return `
      ${chartSvg(r, res.population, width)}
      <div class="verdict tone-${r.tone}" data-testid="verdict" data-class="${esc(r.verdict_class || '')}">${esc(r.headline)}</div>
      <div class="cond">${esc(r.condition || (r.verdict === 'approved' ? 'No condition.' : ''))}</div>
      <div class="stat3">
        <span><span class="k">Predicted peak</span><b data-testid="peak">${r.peak}</b> <span class="k" style="display:inline">at ${esc(r.peak_time_text)}</span></span>
        <span><span class="k">${r.verdict === 'approved_with_condition' ? 'Chance of a low, with the advice' : 'Chance of a low'}</span><b>${esc(r.p_low_final_word || r.p_low_word)}</b></span>
        <span><span class="k">Low point</span><b>${r.low}</b> <span class="k" style="display:inline">at ${esc(r.low_time_text)}</span></span>
      </div>
      <div class="reason" data-testid="reason">${esc(r.reason)}</div>${cause}`
  }
  function renderPanels(res, animate) {
    const host = $('#panels')
    host.classList.remove('hidden')
    host.innerHTML = ''
    const width = Math.max(240, Math.floor((host.clientWidth - 2 * 24) / 3) - 2 * 24 - 2)
    ORDER.forEach((who, i) => {
      const person = data.personas.find((x) => x.id === who)
      const el = document.createElement('div'); el.className = 'card panel'; el.dataset.person = who; el.dataset.testid = `panel-${who}`
      el.innerHTML = `<div class="who" style="display:flex;align-items:center;gap:8px"><span class="avatar sm">${person.avatar}</span><b>${esc(person.name)}</b></div>` + panelHtml(person, res, who, width)
      host.appendChild(el)
      drawn[who] = window6(shown(res, who).curve, shown(res, who).marker).median.slice()
      if (animate) {
        setTimeout(() => { el.classList.add('in'); animateDraw(el.querySelector('svg')) }, 120 + i * 100)
      } else el.classList.add('in')
    })
  }
  function tweenPanels(res) {
    // 400 ms from the curves on screen to the target curves; verdict text swaps at the midpoint
    const targets = {}
    ORDER.forEach((who) => { const r = shown(res, who); targets[who] = window6(r.curve, r.marker).median.slice() })
    const from = {}; ORDER.forEach((who) => { from[who] = (drawn[who] || targets[who]).slice() })
    const t0 = performance.now()
    ORDER.forEach((who) => { const v = $(`#panels [data-person=${who}] .verdict`); if (v) v.style.opacity = '0' })
    function step(now) {
      const k = Math.min(1, (now - t0) / 400), e = 1 - Math.pow(1 - k, 3)
      ORDER.forEach((who) => {
        const el = $(`#panels [data-person=${who}]`); if (!el) return
        const line = el.querySelector('path.line'); const vals = targets[who].map((t, i) => (from[who][i] ?? t) + (t - (from[who][i] ?? t)) * e)
        if (line) line.setAttribute('d', pathOf(vals))
      })
      if (k < 1) requestAnimationFrame(step)
      else {
        ORDER.forEach((who) => {
          const el = $(`#panels [data-person=${who}]`); if (!el) return
          const person = data.personas.find((x) => x.id === who)
          const width = el.querySelector('svg').getAttribute('width')
          const keep = el.querySelector('.who').outerHTML
          el.innerHTML = keep + panelHtml(person, res, who, +width)
          drawn[who] = targets[who]
        })
      }
    }
    requestAnimationFrame(step)
  }

  // ------------------------------------------------------------ summary (built from the numbers and each person's cause)
  function foodWord(res) { const r = res.personal.alex; return res.kind === 'skip' ? 'skipping lunch' : (r.marker_label || 'that') }
  function bullets(res) {
    const ps = ORDER.map((w) => ({ id: w, s: data.personas.find((x) => x.id === w), r: res.personal[w] }))
    return ps.map((p) => {
      const cause = p.r.cause && p.r.cause.key !== 'average' ? p.r.cause.text : 'the numbers are close to average here'
      let cons
      if (p.r.verdict === 'approved_with_condition') cons = `"${p.r.headline.toLowerCase()}": ${p.r.condition.toLowerCase()}`
      else if (p.r.verdict === 'denied') cons = `${foodWord(res)} is a "${p.r.headline.toLowerCase()}" (peak ${p.r.peak}, low ${p.r.low})`
      else cons = `it is a "${p.r.headline.toLowerCase()}" (peak ${p.r.peak} at ${p.r.peak_time_text})`
      return `<li><b>${esc(p.s.name)}:</b> ${esc(cause)}, so ${esc(cons)}.</li>`
    }).join('')
  }
  function renderSummary(res, animate) {
    const el = $('#summary')
    el.classList.remove('hidden'); el.classList.remove('in')
    if (!personalized) {
      const pop = res.population
      el.innerHTML = `<div class="head">Predicted peaks: ${pop.peak} / ${pop.peak} / ${pop.peak} mg/dL<small>Verdicts: ${esc(pop.headline.toLowerCase())} / ${esc(pop.headline.toLowerCase())} / ${esc(pop.headline.toLowerCase())}</small></div><div class="same" data-testid="same">Without personalization, everyone gets the same answer.</div>`
    } else {
      const ps = ORDER.map((w) => res.personal[w])
      el.innerHTML = `<div class="head" data-testid="peaks">Predicted peaks: ${ps.map((p) => p.peak).join(' / ')} mg/dL<small data-testid="verdicts">Verdicts: ${ps.map((p) => esc(p.headline.toLowerCase())).join(' / ')}</small></div><ul data-testid="bullets">${bullets(res)}</ul>`
    }
    const delay = animate ? 120 + 2 * 100 + 400 + 300 : 0
    setTimeout(() => { el.classList.add('in'); timing.summary = performance.now(); timing.total_ms = Math.round(timing.summary - timing.start) }, delay)
  }

  // ------------------------------------------------------------ flow
  const LOAD_MS = 1000
  const STATUSES = (name) => [`reading ${name}'s last 90 days`, 'running 200 futures', 'checking safety rules']
  let loadTimer = null
  function renderSkeleton() {
    const host = $('#panels')
    host.classList.remove('hidden')
    host.innerHTML = ''
    ORDER.forEach((who, i) => {
      const person = data.personas.find((x) => x.id === who)
      const el = document.createElement('div'); el.className = 'card skel'; el.dataset.testid = `skeleton-${who}`
      el.innerHTML = `<div class="who" style="display:flex;align-items:center;gap:8px"><span class="avatar sm">${person.avatar}</span><b>${esc(person.name)}</b></div>
        <div class="bar"><i></i></div><div class="sim">Simulating three bodies…</div><div class="st" data-st="${who}">${esc(STATUSES(person.name)[0])}</div>
        <div class="blk" style="height:180px"></div><div class="blk" style="height:34px;width:55%"></div><div class="blk" style="height:16px;width:80%"></div>`
      host.appendChild(el)
    })
    let k = 0
    const tick = () => {
      k += 1
      ORDER.forEach((who, i) => { const el = host.querySelector(`[data-st=${who}]`); if (el) { const person = data.personas.find((x) => x.id === who); const st = STATUSES(person.name); el.textContent = st[(k + i) % st.length] } })
    }
    return setInterval(tick, 300)
  }
  function show(res, tag) {
    current = res
    timing.start = timing.start || performance.now()
    document.body.classList.remove('state-initial'); document.body.classList.add('state-answer')
    $('#qtext').textContent = res.asked || res.text
    $('#qtag').classList.toggle('hidden', !tag)
    if (tag) $('#qtag').textContent = tag
    $('#summary').classList.add('hidden'); $('#summary').classList.remove('in')
    if (loadTimer) { clearInterval(loadTimer.iv); clearTimeout(loadTimer.to) }
    const iv = renderSkeleton()
    const to = setTimeout(() => { clearInterval(iv); if (current !== res) return; renderPanels(res, true); renderSummary(res, true) }, LOAD_MS)
    loadTimer = { iv, to }
  }
  function reset() {
    if (loadTimer) { clearInterval(loadTimer.iv); clearTimeout(loadTimer.to); loadTimer = null }
    document.body.classList.remove('state-answer'); document.body.classList.add('state-initial')
    $('#summary').classList.remove('in'); $('#panels').querySelectorAll('.panel').forEach((p) => p.classList.remove('in'))
    setTimeout(() => { $('#panels').classList.add('hidden'); $('#panels').innerHTML = ''; $('#summary').classList.add('hidden') }, 600)
    current = null; timing.start = 0; drawn = {}
    $('#input').value = ''; $('#status').textContent = ''
    setTimeout(() => { $('#input').focus(); fitFooter() }, 50)
  }
  function bankMatch(text) {
    const t = text.trim().toLowerCase().replace(/\?+$/, '').trim()
    return data.bank.find((b) => b.text.toLowerCase().replace(/\?+$/, '').trim() === t)
  }
  function nearest(text) {
    const stop = new Set(['a', 'an', 'the', 'i', 'can', 'have', 'with', 'at', 'now', 'right', 'today', 'tomorrow', 'of', 'for', 'my', 'some'])
    const words = new Set(text.toLowerCase().match(/[a-z]+/g) || []); stop.forEach((w) => words.delete(w))
    let best = null, score = -1
    for (const b of data.bank) { const bw = new Set(b.text.toLowerCase().match(/[a-z]+/g) || []); let s = 0; words.forEach((w) => { if (bw.has(w)) s++ }); if (s > score) { best = b; score = s } }
    return best ? data.results[best.slug] : null
  }
  async function ask(text) {
    text = (text || '').trim()
    if (!text) return
    timing.start = performance.now()
    $('#input').value = text
    const bank = bankMatch(text)
    if (bank && data.results[bank.slug]) { show(data.results[bank.slug], null); return }
    $('#status').textContent = 'Running the three twins…'
    try {
      const ctrl = new AbortController(); const tm = setTimeout(() => ctrl.abort(), 6000)
      const r = await fetch('/compare/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }), signal: ctrl.signal })
      clearTimeout(tm)
      if (!r.ok) throw new Error(String(r.status))
      const res = await r.json()
      timing.start = performance.now()
      show(res, res.source === 'cached-fallback' ? 'cached' : null)
      if (res.source === 'cached-fallback') $('#qtext').textContent = text
    } catch (e) {
      const near = nearest(text)
      if (!near) { $('#status').textContent = 'Could not answer that.'; return }
      timing.start = performance.now()
      show(Object.assign({}, near, { asked: text }), 'cached')
    }
  }
  function setPersonalized(on) {
    personalized = on
    $('#toggle').classList.toggle('on', on)
    if (!current) return
    tweenPanels(current)
    renderSummary(current, false)
  }

  // ------------------------------------------------------------ wiring
  renderColumns(); renderChips(); renderPill()
  $('#form').addEventListener('submit', (e) => { e.preventDefault(); ask($('#input').value) })
  $('#toggle').addEventListener('click', () => setPersonalized(!personalized))
  $('#again').addEventListener('click', reset)
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { reset(); return }
    const inInput = document.activeElement === $('#input') && $('#input').value.trim().length > 0
    if (/^[1-6]$/.test(e.key) && !inInput && !e.metaKey && !e.ctrlKey) { e.preventDefault(); const b = data.bank[+e.key - 1]; if (b) ask(b.text) }
    if (e.key === 'Enter' && document.activeElement !== $('#input') && current === null) { const v = $('#input').value.trim(); if (v) ask(v) }
  })
  window.addEventListener('resize', fitFooter)
  // refresh from the API: at load, then every minute so the dashboards follow the twins' clock (the bundled copy already rendered everything)
  async function refresh(timeoutMs) {
    try {
      const ctrl = new AbortController(); const tm = setTimeout(() => ctrl.abort(), timeoutMs)
      const r = await fetch('/compare/data', { signal: ctrl.signal }); clearTimeout(tm)
      if (r.ok) { const d = await r.json(); if (d && d.personas && d.results) { data = d; renderPill(); if (!current) { renderColumns(); renderChips() } } }
    } catch (e) { /* API down: the bundled copy stands */ }
  }
  ;(async () => {
    await refresh(1500)
    const m = location.search.match(/[?&]prompt=(\d)/)
    if (m) { const b = data.bank[+m[1] - 1]; if (b) ask(b.text) } else $('#input').focus()
    window.__compare.ready = true
    setInterval(() => refresh(4000), 60000)
  })()
})()
</script>
</body>
</html>
